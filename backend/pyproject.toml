[project]
name = "motionpredict"
version = "0.1.0"
description = "MotionPredict AI - real-time pedestrian detection, tracking and probabilistic trajectory forecasting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "torch>=2.2",
  "ultralytics>=8.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
llm = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motionpredict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
